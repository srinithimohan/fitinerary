name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: Security authorization and authentication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify explicit test partitions and preserved issuer assertions
        run: pnpm test:integration:profiles
      - name: Required real database, Storage, and native authentication guarantees
        run: pnpm test:integration
      - name: Clean up disposable integration resources
        if: always()
        run: node scripts/test-integration.mjs --cleanup
      - name: Upload sanitized required-security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-security-results
          path: .local/integration-required-tests.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Route regression tests (mocked services)
        run: pnpm test

      - name: Audit SQL self-test (isolated PostgreSQL, not RLS verification)
        run: pnpm test:audit-sql

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component browser regressions (isolated harness)
        run: pnpm test:browser

      - name: Build app
        run: pnpm build

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
